[project]
name = "ingestor"

[tool.pytest.ini_options]
addopts = [ "--cov=src", ]
pythonpath = "src"
testpaths = [ "tests", ]
norecursedirs = [".vscode", "scripts", ]

[tool.coverage.run]
omit = ["tests/**"]

[tool.isort]
profile = "black"
src_paths = "src"
skip = [".gitignore", ".dockerignore", "scripts", ".vscode"]
#extend_skip_glob = ["tests/*"]